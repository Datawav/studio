# Publish SeedHammer Studio to GitHub Pages. The editor is the site root
# (gangleri42.github.io/studio/); the plain-text composer sits under
# /textplate/. Both are self-contained static apps whose glyphs.js is
# committed and checked against the firmware source by glyphs-drift.yml.
#
# The one build step here is the SeedHammer emulator: emu/ is a GOOS=js
# compile of the firmware gui, so this job checks the firmware out at a pinned
# commit and runs emu/build.sh, then serves the resulting emu.wasm alongside
# the static files. emu.wasm + wasm_exec.js are build outputs, never committed.
name: "Pages: Studio + emulator + text composer"

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Serialise Pages deploys but never cancel an in-flight one — losing the
# upload between artifact assembly and deploy is worse than queue time.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Firmware commit the emulator AND the curves cost model (studio-core.wasm)
      # are compiled against. Pinned (not `main`) so unrelated firmware edits
      # never change the deployed wasm. Kept equal to glyphs-drift.yml's
      # FIRMWARE_REF — one firmware version backs all of Studio; bump both
      # together (and re-verify emu + core still build) when the gui or curves
      # API they use changes. See emu/README.md.
      FIRMWARE_REPO: Gangleri42/seedhammer
      FIRMWARE_REF: 1446a70ee3da653822a4fee1b0cf5ff5a22da9f7
    steps:
      - uses: actions/checkout@v6

      - name: Check out firmware at the pinned commit
        uses: actions/checkout@v6
        with:
          repository: ${{ env.FIRMWARE_REPO }}
          ref: ${{ env.FIRMWARE_REF }}
          path: _firmware

      - uses: actions/setup-go@v5
        with:
          go-version-file: _firmware/go.mod

      # Fatal: the wasm modules are load-bearing now — the canvas dictionary
      # payloads, the Rich pane's markdown engine and the firmware-exact
      # gauges all live in studio-core.wasm, and the SeedHammer tab in
      # emu.wasm. A deploy without them would silently regress the live
      # site (a warning-masked build failure shipped exactly that risk),
      # so a broken pin or firmware checkout must fail the workflow, not
      # publish a hollow site.
      - name: Build the SeedHammer emulator (emu.wasm + wasm_exec.js)
        run: FIRMWARE_DIR="$GITHUB_WORKSPACE/_firmware" ./emu/build.sh

      # The curves cost model + encoders for the editor. Same pinned
      # firmware, same fatality.
      - name: Build the curves cost model (studio-core.wasm)
        run: FIRMWARE_DIR="$GITHUB_WORKSPACE/_firmware" ./core/build.sh

      - name: Assemble Pages tree
        run: |
          set -euo pipefail
          mkdir -p dist/textplate

          # SeedHammer Studio editor at the site root. Only the named app
          # files ship — repo meta (README, workflows, .gitignore) stays off
          # the published site.
          cp index.html glyphs.js sw.js manifest.webmanifest \
             icon.svg icon-192.png icon-512.png icon-maskable.png \
             nfc-bus.js emu.js canvas.js tracer.js studio-core.js dist/

          # SeedHammer emulator wasm + the wasm_exec.js from the exact Go that
          # built it (they must match). Non-fatal: if the build above failed
          # these are absent and the editor still ships; the SeedHammer tab
          # then shows a load error.
          if cp emu/emu.wasm emu/wasm_exec.js dist/ 2>/dev/null; then
            echo "SeedHammer emu.wasm staged ($(wc -c < dist/emu.wasm) bytes)."
          else
            echo "::warning::emu.wasm/wasm_exec.js absent; the SeedHammer tab will show a load error."
          fi

          # Curves cost model for the canvas editor's firmware-exact gauges.
          # Shares wasm_exec.js with the emu; stage it if the emu step didn't.
          if cp studio-core.wasm dist/ 2>/dev/null; then
            echo "studio-core.wasm staged ($(wc -c < dist/studio-core.wasm) bytes)."
            [ -f dist/wasm_exec.js ] || cp wasm_exec.js dist/ 2>/dev/null || true
          else
            echo "::warning::studio-core.wasm absent; canvas gauges use a JS estimate."
          fi

          # Plain-text composer under /textplate/.
          cp textplate/index.html textplate/glyphs.js dist/textplate/

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
